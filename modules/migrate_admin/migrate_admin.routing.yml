migrate_admin.dashboard:
  path: '/admin/structure/migrate-suite'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MigrationDashboardController::dashboard'
    _title: 'Migration Dashboard'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_detail:
  path: '/admin/structure/migrate-suite/{migration_id}'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MigrationDetailController::detail'
    _title: 'Migration Detail'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_messages:
  path: '/admin/structure/migrate-suite/{migration_id}/messages'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MigrationDetailController::messages'
    _title: 'Migration Messages'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_failed_items:
  path: '/admin/structure/migrate-suite/{migration_id}/failed'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MigrationDetailController::failedItems'
    _title: 'Failed Items'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_reset_failed:
  path: '/admin/structure/migrate-suite/{migration_id}/failed/reset'
  defaults:
    _form: '\Drupal\migrate_admin\Form\FailedItemsResetForm'
    _title: 'Reset Failed Items'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_rerun_by_error:
  path: '/admin/structure/migrate-suite/{migration_id}/messages/rerun'
  defaults:
    _form: '\Drupal\migrate_admin\Form\RerunByErrorForm'
    _title: 'Re-run Items by Error'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_messages_export:
  path: '/admin/structure/migrate-suite/{migration_id}/messages/export'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MessageExportController::exportCsv'
    _title: 'Export Messages'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_history:
  path: '/admin/structure/migrate-suite/{migration_id}/history'
  defaults:
    _controller: '\Drupal\migrate_admin\Controller\MigrationDetailController::history'
    _title: 'Run History'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_run_confirm:
  path: '/admin/structure/migrate-suite/{migration_id}/run'
  defaults:
    _form: '\Drupal\migrate_admin\Form\MigrationRunConfirmForm'
    _title: 'Confirm Migration Run'
  requirements:
    _permission: 'view migrate suite dashboard'

migrate_admin.migration_rollback_confirm:
  path: '/admin/structure/migrate-suite/{migration_id}/rollback'
  defaults:
    _form: '\Drupal\migrate_admin\Form\MigrationRollbackConfirmForm'
    _title: 'Confirm Migration Rollback'
  requirements:
    _permission: 'view migrate suite dashboard'
