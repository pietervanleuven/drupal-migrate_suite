services:
  migrate_suite.table_name_resolver:
    class: Drupal\migrate_suite\Service\MigrateTableNameResolver
    arguments: ['@database']

  migrate_suite.map_query:
    class: Drupal\migrate_suite\Service\MigrateMapQuery
    arguments: ['@database', '@plugin.manager.migration', '@migrate_suite.table_name_resolver']

  migrate_suite.message_query:
    class: Drupal\migrate_suite\Service\MigrateMessageQuery
    arguments: ['@database', '@migrate_suite.table_name_resolver']

  migrate_suite.delta_detection:
    class: Drupal\migrate_suite\Service\DeltaDetectionService
    arguments: ['@database', '@plugin.manager.migration']

  migrate_suite.run_logger:
    class: Drupal\migrate_suite\EventSubscriber\MigrateRunLogger
    arguments: ['@database', '@datetime.time', '@cache_tags.invalidator', '@migrate_suite.delta_detection']
    tags:
      - { name: event_subscriber }
